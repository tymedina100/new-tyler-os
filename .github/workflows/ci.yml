name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tyleros
          POSTGRES_PASSWORD: tyleros
          POSTGRES_DB: tyleros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyleros -d tyleros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TYLEROS_RACE_DATABASE_URL: postgresql://tyleros:tyleros@localhost:5432/tyleros
      TYLEROS_REQUIRE_PG_RACE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check
